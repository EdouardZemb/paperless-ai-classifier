name: Add issues/PRs to Project

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add to GitHub Project
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/EdouardZemb/projects/5
          github-token: ${{ secrets.PROJECTS_TOKEN }}
