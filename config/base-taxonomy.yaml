    relevé_compte: null  # Solde, opérations, mouvements
    relevé_notes: null  # Intérêts, frais
    
    # Fiches de paie
    fiche_paie: null
    bulletin_salaire: null
    fiche_prime: null
    fiche_cotisations: null
    
