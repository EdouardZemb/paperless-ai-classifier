    facture: null  # Type générique (pour backward compatibility)
    facture_énergie: null
    facture_télécoms: null
    facture_abonnement: null
    facture_autre: null
    
    # Attestations enrichies
    attestation: null
    attestation_domicile: null
    attestation_employeur: null
    attestation_sécu: null
    attestation_autre: null
    
    # Contrats
    contrat: null
    contrat_travail: null
    contrat_service: null
    contrat_autre: null
    
    # Documents officiels
    certificat: null
    déclaration: null
    notification: null
    courrier_officiel: null
  
  financial:
    # Relevés bancaires enrichis
    relevé_bancaire: null
